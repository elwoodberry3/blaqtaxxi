<!-- Brand Standard Component: Pill Badge — .claude/skills/layout-system/wireframes/components/pill-badge.html
     Purpose: short status labels — ride status, driver online/offline, fare tier. -->

<span data-component="pill-badge" data-variant="success" class="inline-flex items-center gap-1 rounded-full bg-blaq-green/10 text-blaq-green text-xs font-semibold px-3 py-1">
  <span class="w-1.5 h-1.5 rounded-full bg-blaq-green"></span>
  <span data-slot="label">[e.g. Driver confirmed]</span>
</span>

<span data-component="pill-badge" data-variant="neutral" class="inline-flex items-center gap-1 rounded-full bg-blaq-gray/15 text-blaq-navy text-xs font-semibold px-3 py-1">
  <span data-slot="label">[e.g. Flat rate]</span>
</span>

<span data-component="pill-badge" data-variant="danger" class="inline-flex items-center gap-1 rounded-full bg-blaq-red/10 text-blaq-red text-xs font-semibold px-3 py-1">
  <span data-slot="label">[e.g. Cancelled]</span>
</span>
